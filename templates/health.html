<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome to the App</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #1a1a2e;
      padding: 20px;
    }

    .card {
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 48px 40px;
      max-width: 460px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 1.9rem;
      margin-bottom: 12px;
    }

    p.subtitle {
      color: #5a5a72;
      margin-bottom: 28px;
    }

    .status {
      display: inline-block;
      background: #e8f7ee;
      color: #1a7f43;
      border-radius: 999px;
      padding: 6px 16px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 28px;
    }

    a.button {
      display: inline-block;
      background: #667eea;
      color: #ffffff;
      text-decoration: none;
      padding: 12px 26px;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    a.button:hover { background: #5568d3; }

    footer {
      margin-top: 28px;
      font-size: 0.8rem;
      color: #8a8aa0;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>App is running</h1>
  </main>
</body>
</html>
